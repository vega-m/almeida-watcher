name: heartbeat

on:
  schedule:
    # 08:03 UTC = 9am Europe/London during BST (8am in winter). Off the hour
    # to dodge the scheduler's top-of-hour congestion.
    - cron: "3 8 * * *"
  workflow_dispatch:

permissions:
  contents: write # pushes a STATUS.md line — also keeps the repo "active" so
  # GitHub never auto-disables the schedules (60-day inactivity rule).

concurrency:
  group: almeida-heartbeat
  cancel-in-progress: true

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: alerted.json
          key: heartbeat-${{ github.run_id }}
          restore-keys: |
            alerted-
            heartbeat-

      - name: Send daily check-in
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          ALERT_STATE_FILE: ${{ github.workspace }}/alerted.json
        run: |
          WATCH_STATE=$(gh api repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml --jq .state 2>/dev/null || echo unknown)
          export WATCH_STATE
          python3 watcher.py --heartbeat

      - name: Log to STATUS.md and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh api repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml --jq .state 2>/dev/null || echo unknown)
          echo "- $(date -u '+%F %H:%M') UTC beat, watch: $STATE" >> STATUS.md
          git config user.name "heartbeat-bot"
          git config user.email "actions@github.com"
          git add STATUS.md
          git commit -m "heartbeat $(date -u '+%F')" || echo "nothing to commit"
          git push
