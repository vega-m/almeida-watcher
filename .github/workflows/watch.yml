name: watch

on:
  schedule:
    # Start a shift every 3h; jobs hand over via the concurrency group so
    # coverage is continuous (each shift runs ~5h20m, next run waits its turn).
    - cron: "11 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almeida-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # Persist "already alerted" across shifts so a churning return that
      # reappears doesn't re-ping every shift. Cooldown lives in watcher.py.
      - uses: actions/cache@v4
        with:
          path: alerted.json
          key: alerted-${{ github.run_id }}
          restore-keys: |
            alerted-

      - name: Watch for returns (~5h20m shift, one check per minute)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_STATE_FILE: ${{ github.workspace }}/alerted.json
        run: |
          for i in $(seq 1 320); do
            echo "--- check $i/320 ---"
            python3 watcher.py || true
            sleep 60
          done
